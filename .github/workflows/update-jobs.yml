name: Update jobs
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch_jobs.py
        env:
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
