<script>
$('#pc').textContent=P.length;{const h=P.map(x=>'<span>'+esc(x.n)+'</span>').join('');$('#mq').innerHTML=h+h}CATS.forEach(c=>$('#c').insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>'));
function draw(){const n=$('#n').value.trim().toLowerCase(),c=$('#c').value,q=$('#q').value;
 const L=P.filter(p=>(!c||p.c==c)&&(!n||p.n.toLowerCase().includes(n)));
 $('#st').textContent=L.length+' platforms shown';
 $('#out').innerHTML=L.map(p=>'<article class="card"><h3>'+esc(p.n)+'</h3><p><span class="tag">'+esc(p.c)+'</span></p><p class="m s">'+esc(p.d)+'</p><a class="btn" href="'+esc(searchUrl(p,q))+'" target="_blank" rel="noopener noreferrer">'+(q.trim()?'Search "'+esc(q.trim())+'"':'Visit website')+'</a></article>').join('');}
['q','n','c'].forEach(i=>$('#'+i).addEventListener('input',draw));draw();
