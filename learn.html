<body data-page="learn" data-t="Learn and Resources" data-d="Roadmaps, checklists, templates and safety tips for freelancers.">
<main class="wrap"><div data-ad="banner"></div>
<h2>Getting started checklist</h2><div class="card ck" id="gs"></div><p class="m s" id="gp"></p>

<script>
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};
const GS=['Pick one main skill and one niche (for example, short video editing for gym coaches).','Make 3 to 5 sample works and put them in one portfolio link.','Write a clear profile headline and a short bio about the result you give clients.','Set a starting rate. Use the Rate Calculator on the Tools page.','Choose how you will receive payments. Check which services work in your country before you start.','Send 5 personal proposals a day. Do not copy the same message.','Track every application with Save and Mark applied on the Jobs page.','Agree scope, price and deadline in writing before you start any work.','Deliver on time, then politely ask for a review.','Keep part of every payment for tax and slow months.'];
let ck=ld('jh_chk',[]);
function gs(){$('#gs').innerHTML=GS.map((t,i)=>'<label><input type="checkbox" data-i="'+i+'"'+(ck.includes(i)?' checked':'')+'> <span>'+esc(t)+'</span></label>').join('');$('#gp').textContent=ck.length+' of '+GS.length+' steps done'}
$('#gs').onchange=e=>{const i=+e.target.dataset.i;ck=ck.includes(i)?ck.filter(x=>x!=i):ck.concat(i);try{localStorage.setItem('jh_chk',JSON.stringify(ck))}catch(x){}gs()};gs();
const SC=['It asks you to pay a fee to get the job or for "training".','It wants to move the chat to WhatsApp or Telegram before any contract.','It sends a cheque or asks you to send money back, buy gift cards or pay with crypto.','The pay is far above normal for very easy work.','The post is vague and has no company name or website.','It asks for bank login, passwords or ID copies before hiring.','It asks for a long free "test" that looks like real work.','It pushes you with urgency ("start now, no questions").','You cannot find the company online, or it uses a free personal email.','It refuses to use the platform payment protection.'];
$('#sc').innerHTML=SC.map(t=>'<label><input type="checkbox"> <span>'+esc(t)+'</span></label>').join('');
function sc(){const n=document.querySelectorAll('#sc input:checked').length,e=$('#sr');
 e.className='lv '+(n==0?'a':n<3?'b':'c');e.textContent=n==0?'No red flags ticked. Still check the client and use the platform payment protection.':n<3?'Some red flags ('+n+'). Be careful. Ask questions and verify the company before you go on.':'High risk ('+n+' red flags). Do not pay, share private details or start work. Report the post to the platform.'}
$('#sc').onchange=sc;sc();
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const RM=[['Video Editing',['Learn cutting, pacing, captions and sound.','Practice with free software.','Make 5 sample edits (reel, intro, short ad).','Learn colour and audio basics.','Offer a trial edit to small creators.'],[['DaVinci Resolve (free)','https://www.blackmagicdesign.com/products/davinciresolve'],['CapCut','https://www.capcut.com'],['Video lessons','video editing for beginners']]],
['Graphic Design',['Learn colour, fonts and layout basics.','Practice in a free design tool.','Make 5 thumbnails or logos for sample brands.','Put them on a portfolio page.','Offer a fast first draft to small shops.'],[['Canva','https://www.canva.com'],['Figma','https://www.figma.com'],['Behance','https://www.behance.net'],['Video lessons','graphic design basics for beginners']]],
['Web Development',['Learn HTML, CSS and JavaScript.','Build 3 small projects (portfolio, landing page, app).','Put your code on GitHub.','Learn one framework after the basics.','Offer simple sites to local businesses.'],[['freeCodeCamp','https://www.freecodecamp.org'],['MDN Web Docs','https://developer.mozilla.org'],['GitHub','https://github.com'],['Video lessons','web development for beginners']]],
['Writing',['Pick a niche you know well.','Write 3 samples in that niche.','Learn the basics of search engine writing.','Create a simple portfolio link.','Pitch blogs and small businesses.'],[['Google SEO starter guide','https://developers.google.com/search/docs/fundamentals/seo-starter-guide'],['Video lessons','content writing for beginners']]],
['Digital Marketing',['Learn how ads, search and social media work.','Take free courses.','Run a small practice page or campaign.','Write a short case study with numbers.','Offer a monthly report to small shops.'],[['Google Skillshop','https://skillshop.withgoogle.com'],['HubSpot Academy','https://academy.hubspot.com'],['Video lessons','digital marketing for beginners']]],
['Virtual Assistant',['Get good at email, calendar and spreadsheets.','Learn a note and task tool.','Write clear short updates.','Make a one-page list of services and prices.','Start with one client and grow slowly.'],[['Notion','https://www.notion.so'],['Google Sheets','https://www.google.com/sheets/about/'],['Video lessons','virtual assistant for beginners']]]];
$('#rm').innerHTML=RM.map(r=>'<article class="card"><h3>'+esc(r[0])+'</h3><ol style="padding-left:20px;color:var(--m)">'+r[1].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p>'+r[2].map(l=>'<a class="tag" href="'+esc(/^http/.test(l[1])?l[1]:yt(l[1]))+'" target="_blank" rel="noopener noreferrer">'+esc(l[0])+' ↗</a>').join('')+'</p></article>').join('');
const TP=[['Project agreement (short)','Project: [name]\nClient: [name]\nFreelancer: [your name]\n\n1. Work to deliver: [list]\n2. Price: [amount] (paid [before / half before and half after / on delivery])\n3. Deadline: [date]\n4. Revisions included: [number]. Extra revisions are charged at [rate].\n5. The client gives all files and feedback on time. The deadline moves if they are late.\n6. Rights to the final work pass to the client after full payment.\n\nAgreed by both sides in writing (message or email is fine).'],
['Follow-up after no reply','Hello [name],\n\nI wanted to follow up on my proposal for [project]. I am happy to answer any questions or adjust the plan. If you have already chosen someone, no problem, and thank you for your time.\n\nBest regards,\n[your name]'],
['Reply to "too expensive"','Thank you for being open with me. My price covers [what is included]. If your budget is lower, I can reduce the scope, for example [smaller option], and keep the quality high. Which would you prefer?'],
['Delivery message','Hello [name],\n\nYour [project] is ready: [link]. It includes [list]. Please check it and send any changes in one message so I can finish them quickly. I included [number] revisions.\n\nThank you,\n[your name]'],
['Politely decline a job','Thank you for thinking of me. I cannot take this project because [short reason, for example my schedule is full]. I wish you the best with it.']];
$('#tp').innerHTML=TP.map(t=>'<article class="card"><h3>'+esc(t[0])+'</h3><p class="m s" style="white-space:pre-line;max-height:7.5em;overflow:hidden">'+esc(t[1])+'</p><button class="btn o" data-txt="'+esc(t[1])+'" onclick="cp(this)">Copy template</button></article>').join('');
const GD=[['How to write a profile that gets replies',['Start with who you help and the result you give, not your life story.','Use a clear headline with your skill and niche.','Show 3 to 5 best samples, not everything.','Add numbers when you can (views, sales, time saved).','Use a clear photo and a friendly, short bio.']],
['How to price your work',['Work out your hourly rate with the Rate Calculator.','Price by project when the work is clear, by hour when it is not.','Start fair, not cheapest. The lowest price attracts the hardest clients.','Raise your price after each few good reviews.','Add the platform fee to your price, not on top of your income.']],
['How to write a proposal that wins',['Open with the client\'s problem, not with yourself.','Mention one detail from their post to show you read it.','Share one or two close samples.','Give a clear price and delivery time.','End with one question.']],
['Getting paid safely',['Prefer the platform payment protection (escrow) when it exists.','For direct clients, ask for a part payment before you start.','Put price, deadline and revisions in writing.','Send an invoice with a due date (Tools page).','Check which payout services work in your country and compare their fees before you choose.']],
['Working well with clients',['Reply within a day, even if only to say you will answer soon.','Confirm the details before you start.','Send a small preview early so mistakes are found early.','Say no politely to work outside the agreed scope, or quote it separately.','Ask for a review after a good delivery.']],
['Staying safe from scams',['Never pay to get a job.','Keep messages and payments inside the platform until a contract starts.','Do not share passwords, bank logins or ID copies with a new client.','Use the scam checker above when something feels wrong.','Report suspicious posts to the platform.']]];
$('#gd').innerHTML=GD.map(g=>'<details class="card"><summary>'+esc(g[0])+'</summary><ul>'+g[1].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>').join('');
const GL=[['Escrow','The client puts money with the platform first, and it is released to you after the work is approved.'],['Milestone','One part of a bigger project with its own price and payment.'],['Retainer','A fixed monthly payment for regular work.'],['Scope','What is included in the job. Work outside it is extra.'],['Scope creep','When a client keeps adding work without paying more.'],['Proposal','Your message that offers to do a job.'],['Portfolio','A page that shows your best work.'],['Niche','A focused area you serve, such as videos for fitness coaches.'],['Billable hours','Hours you can charge a client for.'],['Invoice','A document that asks a client to pay, with amount and due date.']];
$('#gl').innerHTML=GL.map(x=>'<div style="padding:6px 0;border-bottom:1px solid var(--l)"><b>'+esc(x[0])+'</b> <span class="m">· '+esc(x[1])+'</span></div>').join('');
</script></body></html>
